name: wifi_direct_chat
description: A Wi-Fi Direct chat app
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
    
  flutter_webrtc: ^1.5.2
  flutter_pcm_sound: ^3.3.2
  open_file: ^3.3.2
  share_plus: ^13.1.0          # ✅ Verified latest
  cross_file: ^0.3.4
  flutter_p2p_connection: ^3.0.3
  permission_handler: ^12.0.1  # ✅ Verified latest
  file_picker: ^10.2.0
  path_provider: ^2.1.0
  encryptify: ^0.0.4
  flutter_secure_storage: ^10.3.1  # ✅ Verified latest
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  uuid: ^4.0.0
  flutter_sound: ^9.30.0       # ✅ Verified latest
  device_info_plus: ^13.2.0    # ✅ Verified latest

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

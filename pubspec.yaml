name: wifi_direct_chat
description: A Wi-Fi Direct chat app
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_webrtc: ^1.5.2
  flutter_pcm_sound: ^3.3.3
  open_file: ^3.5.11
  share_plus: ^12.0.0
  cross_file: ^0.3.4
  flutter_p2p_connection: ^3.0.3
  permission_handler: ^12.0.1
  file_picker: ^10.2.0
  path_provider: ^2.1.6
  encryptify: ^0.0.4
  flutter_secure_storage: ^10.3.1  # Keep this for AGP 9 compatibility
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  flutter_sound: ^9.30.0
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

dependency_overrides:
  # Required: flutter_p2p_connection pins permission_handler ^11.3.1,
  # which conflicts with the version this app needs.
  permission_handler: ^12.0.1
  # Required: encryptify pins flutter_secure_storage ^9.2.4,
  # which conflicts with the version this app needs.
  flutter_secure_storage: ^10.3.1
  # win32 released a breaking v6.0. flutter_secure_storage_windows 4.2.x moved to
  # win32 ^6.0.1, but file_picker, device_info_plus, share_plus (Windows helper),
  # and win32_registry are all still written against the win32 5.x API and do not
  # yet compile against 6.x (see e.g. github.com/miguelpruivo/flutter_file_picker
  # issue #1980, still open). Pinning flutter_secure_storage_windows back to its
  # last pre-6.x release avoids dragging the whole tree onto win32 6.x.
  flutter_secure_storage_windows: 4.1.0
  win32: 5.15.0

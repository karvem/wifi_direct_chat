name: wifi_direct_chat
description: A Wi-Fi Direct chat app
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
    
  flutter_webrtc: ^1.5.2          # ✅ Verified - AGP 9 compatible
  flutter_pcm_sound: ^3.3.3       # ⬆️ Updated
  open_file: ^3.5.11              # ⬆️ Updated
  share_plus: ^13.1.0             # ⬆️ Updated - AGP 9 compatible
  cross_file: ^0.3.4
  flutter_p2p_connection: ^3.0.3  # ⚠️ Keep as-is (no newer version)
  permission_handler: ^12.0.1     # ⬆️ Updated - AGP 9 compatible
  file_picker: ^10.2.0            # ⚠️ Keep stable (beta available)
  path_provider: ^2.1.6           # ⬆️ Updated
  encryptify: ^0.0.4              # ⚠️ Keep as-is (no newer version)
  flutter_secure_storage: ^10.3.1 # ⬆️ Updated - AGP 9 compatible
  hive: ^2.2.3                    # ⬆️ Updated
  hive_flutter: ^1.1.0
  uuid: ^4.5.1                    # ⬆️ Updated
  flutter_sound: ^9.30.0          # ⬆️ Updated
  device_info_plus: ^13.2.0       # ⬆️ Updated - AGP 9 compatible

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

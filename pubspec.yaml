name: wifi_direct_chat
description: A Wi-Fi Direct chat app
version: 1.0.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
    
  flutter_webrtc: ^1.5.2
  flutter_pcm_sound: ^3.3.3
  open_file: ^3.5.11
  share_plus: ^12.0.0
  cross_file: ^0.3.4
  flutter_p2p_connection: ^3.0.3
  permission_handler: ^12.0.1
  file_picker: ^10.2.0
  path_provider: ^2.1.6
  encryptify: ^0.0.4
  flutter_secure_storage: ^10.3.1  # Keep this for AGP 9 compatibility
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  flutter_sound: ^9.30.0
  device_info_plus: ^13.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

dependency_overrides:
  flutter_secure_storage: ^10.3.1   # Force the newer version
  permission_handler: ^12.0.1
  win32: 5.10.0
  win32_registry: 1.1.3
